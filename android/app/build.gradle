apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// kapt, not KSP: no published KSP release targets this project's Kotlin version (see the
// hidden-downloader/playlists-tab notepad, task T2, for the Maven Central evidence). kapt ships
// inside the kotlin-gradle-plugin already on the buildscript classpath above, so unlike KSP it
// needs no separately-versioned artifact to match against Kotlin.
apply plugin: 'org.jetbrains.kotlin.kapt'

// Android does not read package.json for its version.  Derive both Android
// values from the checked-out Git history instead:
//
//   v1.2.3 tag at HEAD  -> versionName 1.2.3
//   commits after it    -> versionName 1.2.3-dev.4+gabcdef0
//   no SemVer tag yet   -> versionName 0.0.0-dev.<commit-count>+gabcdef0
//
// A commit count is monotonically increasing along the release branch, which
// makes it a suitable Android versionCode.  Release builds are deliberately
// restricted to an exact vMAJOR.MINOR.PATCH tag: an APK meant for distribution
// therefore always has a stable, traceable version name.
def gitOutput = { List<String> arguments ->
    def stdout = new ByteArrayOutputStream()
    try {
        def result = rootProject.exec {
            workingDir rootProject.rootDir.parentFile
            commandLine(['git'] + arguments)
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? stdout.toString('UTF-8').trim() : null
    } catch (Exception ignored) {
        return null
    }
}

def gitCommitCount = gitOutput(['rev-list', '--count', 'HEAD'])
def androidVersionCode = (gitCommitCount?.isInteger() ? gitCommitCount.toInteger() : 1)
def gitDescription = gitOutput(['describe', '--tags', '--match', 'v[0-9]*', '--long', '--dirty', '--always'])
def gitTag = gitOutput(['describe', '--tags', '--match', 'v[0-9]*', '--exact-match'])
def releaseTagMatcher = (gitTag ?: '') =~ /^v(\d+\.\d+\.\d+)$/
def isExactReleaseTag = releaseTagMatcher.matches()
def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

def androidVersionName
if (isExactReleaseTag) {
    androidVersionName = releaseTagMatcher[0][1]
} else {
    def descriptionMatcher = (gitDescription ?: '') =~ /^v(\d+\.\d+\.\d+)-(\d+)-g([0-9a-f]+)(-dirty)?$/
    if (descriptionMatcher.matches()) {
        def dirtySuffix = descriptionMatcher[0][4] ? '.dirty' : ''
        androidVersionName = "${descriptionMatcher[0][1]}-dev.${descriptionMatcher[0][2]}+g${descriptionMatcher[0][3]}${dirtySuffix}"
    } else {
        def gitHash = gitOutput(['rev-parse', '--short', 'HEAD']) ?: 'unknown'
        androidVersionName = "0.0.0-dev.${androidVersionCode}+g${gitHash}"
    }
}

if (isReleaseTask && !isExactReleaseTag) {
    throw new GradleException(
        'Release builds must be made from an exact annotated or lightweight Git tag named vMAJOR.MINOR.PATCH.\n' +
        'For example: git tag -a v1.0.0 -m "Kefi Player 1.0.0"\n'
    )
}

android {
    namespace = "com.kefi.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kefi.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // scripts/build-apk.sh passes -PabiFilters=<comma-separated list> to restrict native
            // ABIs; default to arm64-v8a only when it's absent (covers essentially all phones
            // from ~2018 on, and keeps the APK from also carrying an x86_64 copy of yt-dlp/ffmpeg).
            abiFilters.addAll(project.findProperty('abiFilters')?.split(',') ?: ['arm64-v8a'])
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Optional release signing. Create android/keystore.properties with:
    //   storeFile=/absolute/path/to/kefi-player.jks
    //   storePassword=...
    //   keyAlias=...
    //   keyPassword=...
    // `npm run keystore` generates both the key and that file. Without it, only
    // debug builds are signed.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def hasKeystore = keystorePropsFile.exists()
    if (hasKeystore) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }

        // A stale storeFile path (typically the key was moved after it was
        // created) otherwise surfaces as AGP's terse "Keystore file not found"
        // mid-build. Fail early and say what to do -- but only when a release
        // build was actually asked for, so debug builds keep working with no key.
        def storeFilePath = keystoreProps['storeFile']
        def keystoreFile = storeFilePath ? file(storeFilePath) : null
        def wantsRelease = gradle.startParameter.taskNames.any {
            it.toLowerCase().contains('release')
        }
        if (wantsRelease && (keystoreFile == null || !keystoreFile.exists())) {
            throw new GradleException(
                "Release signing key not found.\n\n" +
                "  android/keystore.properties says:\n    storeFile=${storeFilePath}\n" +
                "  ...but no file exists there.\n\n" +
                "Either fix that path (did you move the .jks?), or create a new key with:\n" +
                "    npm run keystore\n"
            )
        }

        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Java compatibility is set to 21 by the generated capacitor.build.gradle,
    // which is applied after this block. Kotlin must match it exactly or the
    // JVM-target validation task fails.
    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            // youtubedl-android smuggles its Python/ffmpeg payloads in as
            // lib*.zip.so files and unzips them at first launch. AGP defaults to
            // uncompressed, un-extracted native libs, which leaves those payloads
            // unreachable and makes YoutubeDL.init() fail. Legacy packaging puts
            // them back on disk where the library expects them.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Media3: exoplayer for audio playback, session for notification/lock-screen controls.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    // yt-dlp + a bundled Python runtime, and the matching ffmpeg build. This is
    // the actively-maintained fork (the one Seal uses); the original arthenica
    // ffmpeg-kit was retired and its binaries pulled from Maven Central on
    // 2025-04-01, so ffmpeg comes from here instead.
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroidVersion"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroidVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    // Room: local database for playlists + favourites (behind the plugin bridge, Kotlin-only).
    // Annotation processing goes through kapt, not KSP -- see the apply plugin line above for why.
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Room schema export (via the room.schemaLocation kapt argument): writes the DB schema as JSON
// to android/app/schemas on every build, for migration testing. Ignored in android/.gitignore,
// same reasoning as the potoken build output there -- generated, never committed.
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
